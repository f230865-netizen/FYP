<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Getting Started — Dr. Data</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --navy:#0F1E35;--navy-light:#162844;--teal:#1ABCB0;--teal-dim:#0e8c82;
  --slate:#4A6580;--mist:#F0F4F8;--white:#FFFFFF;--text:#1A2B3C;
  --text-muted:#5A7290;--border:#D4E0EC;--radius:10px;
  --shadow:0 2px 16px rgba(15,30,53,0.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter",sans-serif;color:var(--text);background:var(--mist);min-height:100vh;-webkit-font-smoothing:antialiased}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:60px;background:var(--white);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:34px;width:auto}
.brand-name{font-family:"Space Grotesk",sans-serif;font-size:17px;font-weight:700;color:var(--navy)}
.topbar-right a{color:var(--teal);font-weight:500;font-size:13px;text-decoration:none}
.progress-wrap{background:var(--white);border-bottom:1px solid var(--border);padding:16px 48px}
.progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.progress-label{font-size:13px;font-weight:500;color:var(--navy)}
.progress-count{font-size:12px;color:var(--text-muted)}
.progress-track{height:6px;background:var(--mist);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;background:var(--teal);transition:width .4s ease}
.step-dots{display:flex;gap:8px;margin-top:12px}
.step-dot{flex:1;height:3px;border-radius:2px;background:var(--border);transition:background .3s}
.step-dot.done{background:var(--teal)}
.step-dot.active{background:var(--navy)}
.main{display:flex;justify-content:center;align-items:flex-start;padding:48px 24px;min-height:calc(100vh - 120px)}
.quiz-card{width:100%;max-width:680px;background:var(--white);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden}
.card-header{background:var(--navy);padding:32px 40px}
.q-step{font-size:11px;font-weight:600;color:rgba(255,255,255,0.4);letter-spacing:.08em;margin-bottom:8px}
.q-title{font-family:"Space Grotesk",sans-serif;font-size:22px;font-weight:700;color:var(--white);line-height:1.3;margin-bottom:6px}
.q-sub{font-size:13px;color:rgba(255,255,255,0.5);line-height:1.6}
.card-body{padding:32px 40px}
.options{display:flex;flex-direction:column;gap:12px}
.option{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;border-radius:10px;border:1.5px solid var(--border);cursor:pointer;transition:all .18s}
.option:hover{border-color:var(--teal);background:rgba(26,188,176,0.04)}
.option.selected{border-color:var(--teal);background:rgba(26,188,176,0.07)}
.option.selected .opt-radio{background:var(--teal);border-color:var(--teal)}
.option.selected .opt-radio::after{display:block}
.opt-radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;margin-top:1px;position:relative;transition:all .18s;background:var(--white)}
.opt-radio::after{content:"";display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;background:var(--white)}
.opt-label{font-size:14px;font-weight:600;color:var(--navy);margin-bottom:3px}
.opt-desc{font-size:12px;color:var(--text-muted);line-height:1.5}
.options.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card-footer{display:flex;justify-content:space-between;align-items:center;padding:20px 40px;border-top:1px solid var(--border);background:var(--mist)}
.btn-back{padding:10px 20px;border:1.5px solid var(--border);border-radius:8px;background:var(--white);font-size:14px;font-weight:500;color:var(--slate);cursor:pointer;transition:all .15s}
.btn-back:hover{border-color:var(--navy);color:var(--navy)}
.btn-back:disabled{opacity:.4;cursor:not-allowed}
.btn-next{padding:11px 28px;background:var(--navy);border:none;border-radius:8px;font-size:14px;font-weight:600;color:var(--white);cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:8px}
.btn-next:hover{background:var(--navy-light)}
.btn-next:disabled{opacity:.4;cursor:not-allowed}
.btn-next.teal{background:var(--teal)}
.btn-next.teal:hover{background:var(--teal-dim)}
.skip-link{font-size:12px;color:var(--text-muted);cursor:pointer;text-decoration:underline}
.complete-screen{display:none;text-align:center;padding:56px 40px}
.complete-icon{font-size:56px;margin-bottom:20px}
.complete-title{font-family:"Space Grotesk",sans-serif;font-size:28px;font-weight:700;color:var(--navy);margin-bottom:10px}
.complete-sub{font-size:15px;color:var(--text-muted);margin-bottom:36px;max-width:400px;margin-left:auto;margin-right:auto;line-height:1.7}
.profile-summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:36px;text-align:left}
.profile-item{background:var(--mist);border-radius:10px;padding:14px 18px;border:1px solid var(--border)}
.profile-item-label{font-size:11px;font-weight:600;color:var(--teal);letter-spacing:.05em;margin-bottom:4px}
.profile-item-val{font-size:14px;font-weight:500;color:var(--navy)}
.btn-go{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;background:var(--teal);color:var(--white);border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:background .18s}
.btn-go:hover{background:var(--teal-dim)}
</style>
</head>

<script>
const API = 'http://localhost:8000';

const QUESTIONS = [
  {
    key: 'persona',
    title: 'What best describes you?',
    sub: 'This helps us show you the most relevant features and workflows.',
    grid: false,
    options: [
      { value: 'student',   label: 'Student / Researcher',        desc: 'University project, thesis, or academic research.' },
      { value: 'analyst',   label: 'Data Analyst',                desc: 'Working with business data, reports, and dashboards.' },
      { value: 'scientist', label: 'Data Scientist / ML Engineer', desc: 'Building and training machine learning models.' },
      { value: 'business',  label: 'Business User',               desc: 'Non-technical — I work with data but not code.' }
    ]
  },
  {
    key: 'skill_level',
    title: 'How comfortable are you with data cleaning?',
    sub: 'Be honest — we tailor the AI language and suggestions to your level.',
    grid: false,
    options: [
      { value: 'beginner',     label: 'Just getting started',        desc: 'Not sure where to begin with messy data.' },
      { value: 'beginner',     label: 'I know the basics',           desc: 'Cleaned data before but need guidance.' },
      { value: 'intermediate', label: 'Comfortable with pandas / R', desc: 'I write cleaning code regularly.' },
      { value: 'expert',       label: 'Professional',                desc: 'Data cleaning is a core part of my daily work.' }
    ]
  },
  {
    key: 'default_modality',
    title: 'What kind of data do you usually work with?',
    sub: 'We will set your default pipeline based on this.',
    grid: true,
    options: [
      { value: 'tabular', label: 'Spreadsheets / CSV',  desc: 'Excel, CSV, or JSON tables.' },
      { value: 'image',   label: 'Image datasets',      desc: 'Folders of JPG, PNG, or labelled images.' },
      { value: 'mixed',   label: 'Both',                desc: 'I work with tabular and image data.' },
      { value: 'tabular', label: 'Survey / Form data',  desc: 'Responses, questionnaires, structured forms.' }
    ]
  },
  {
    key: 'ai_mode',
    title: 'How do you want AI suggestions to work?',
    sub: 'You can change this any time in your preferences.',
    grid: false,
    options: [
      { value: 'explain_all', label: 'Explain everything',        desc: 'Tell me what each technique means and why you recommend it.' },
      { value: 'suggest',     label: 'Show and I will decide',    desc: 'Give me the suggestion and let me confirm or choose an alternative.' },
      { value: 'auto',        label: 'Just do it automatically',  desc: 'Apply the best technique without asking me each time.' }
    ]
  },
  {
    key: 'use_case',
    title: 'What do you usually do with clean data after?',
    sub: 'This shapes the type of report and visualisations we generate.',
    grid: true,
    options: [
      { value: 'ml',        label: 'Train an ML model',    desc: 'Feed into scikit-learn, TensorFlow, or similar.' },
      { value: 'reporting', label: 'Make charts / reports', desc: 'Dashboards, presentations, or analysis.' },
      { value: 'sharing',   label: 'Share with a team',    desc: 'Export clean data for others to use.' },
      { value: 'exploring', label: 'Explore and learn',    desc: 'Still figuring out what I need.' }
    ]
  }
];

let current = 0;
let answers = {};

function init() {
  const user = JSON.parse(localStorage.getItem('dr_data_user') || 'null');
  if (!user) {
    // No user found — seed a guest session so the quiz still works for testing
    localStorage.setItem('dr_data_user', JSON.stringify({id:'guest', is_new_user:true}));
  }
  const dots = document.getElementById('step-dots');
  QUESTIONS.forEach(function(_, i) {
    const d = document.createElement('div');
    d.className = 'step-dot' + (i === 0 ? ' active' : '');
    d.id = 'dot-' + i;
    dots.appendChild(d);
  });
  renderQuestion(0);
}

function renderQuestion(idx) {
  const q = QUESTIONS[idx];
  document.getElementById('q-step').textContent = 'QUESTION ' + (idx+1) + ' OF ' + QUESTIONS.length;
  document.getElementById('q-title').textContent = q.title;
  document.getElementById('q-sub').textContent = q.sub;
  const container = document.getElementById('options-container');
  container.className = 'options' + (q.grid ? ' grid2' : '');
  container.innerHTML = '';
  q.options.forEach(function(opt, oi) {
    const div = document.createElement('div');
    const savedIdx = answers[q.key + '_idx'];
    div.className = 'option' + (savedIdx === oi ? ' selected' : '');
    div.onclick = function() { selectOption(idx, oi, opt.value); };
    div.innerHTML = '<div class="opt-radio"></div><div class="opt-content"><div class="opt-label">' + opt.label + '</div><div class="opt-desc">' + opt.desc + '</div></div>';
    container.appendChild(div);
  });
  const pct = Math.round((idx / QUESTIONS.length) * 100);
  document.getElementById('progress-fill').style.width = Math.max(pct, 5) + '%';
  document.getElementById('progress-label').textContent = 'Question ' + (idx+1) + ' of ' + QUESTIONS.length;
  document.getElementById('progress-count').textContent = pct + '% complete';
  QUESTIONS.forEach(function(_, i) {
    const dot = document.getElementById('dot-' + i);
    dot.className = 'step-dot' + (i < idx ? ' done' : i === idx ? ' active' : '');
  });
  document.getElementById('btn-back').disabled = idx === 0;
  updateNextBtn();
}

function selectOption(qIdx, optIdx, value) {
  const q = QUESTIONS[qIdx];
  answers[q.key] = value;
  answers[q.key + '_idx'] = optIdx;
  document.querySelectorAll('.option').forEach(function(el, i) {
    el.classList.toggle('selected', i === optIdx);
  });
  updateNextBtn();
}

function updateNextBtn() {
  const q = QUESTIONS[current];
  const hasAnswer = answers[q.key] !== undefined;
  const btn = document.getElementById('btn-next');
  btn.disabled = !hasAnswer;
  const isLast = current === QUESTIONS.length - 1;
  btn.textContent = isLast ? 'Finish →' : 'Next →';
  if (isLast) { btn.classList.add('teal'); } else { btn.classList.remove('teal'); }
}

function nextQuestion() {
  if (current < QUESTIONS.length - 1) {
    current++;
    renderQuestion(current);
  } else {
    submitOnboarding();
  }
}

function prevQuestion() {
  if (current > 0) { current--; renderQuestion(current); }
}

function skipQuestion() {
  if (current < QUESTIONS.length - 1) { current++; renderQuestion(current); }
  else { submitOnboarding(); }
}

async function submitOnboarding() {
  const token = localStorage.getItem('dr_data_token');
  const profile = {
    persona:          answers.persona          || null,
    skill_level:      answers.skill_level      || null,
    default_modality: answers.default_modality || null,
    ai_mode:          answers.ai_mode          || null,
    use_case:         answers.use_case         || null
  };
  if (token) {
    try {
      await fetch(API + '/users/onboarding?token=' + token, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(profile)
      });
    } catch(e) {
      console.warn('Onboarding save skipped:', e);
    }
  }
  const user = JSON.parse(localStorage.getItem('dr_data_user') || '{}');
  user.is_new_user = false;
  localStorage.setItem('dr_data_user', JSON.stringify(user));
  showCompletion(profile);
}

function showCompletion(profile) {
  document.getElementById('question-screen').style.display = 'none';
  document.getElementById('complete-screen').style.display = 'block';
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('progress-label').textContent = 'All done!';
  document.getElementById('progress-count').textContent = '100% complete';
  QUESTIONS.forEach(function(_, i) {
    document.getElementById('dot-' + i).className = 'step-dot done';
  });
  const labelMap = {
    persona:          { student:'Student / Researcher', analyst:'Data Analyst', scientist:'Data Scientist', business:'Business User' },
    skill_level:      { beginner:'Beginner', intermediate:'Intermediate', expert:'Expert' },
    default_modality: { tabular:'Tabular / CSV', image:'Image datasets', mixed:'Both' },
    ai_mode:          { explain_all:'Explain everything', suggest:'Show and decide', auto:'Automatic' },
    use_case:         { ml:'ML model training', reporting:'Charts & reports', sharing:'Team sharing', exploring:'Exploring' }
  };
  const titles = { persona:'Your role', skill_level:'Skill level', default_modality:'Data type', ai_mode:'AI mode', use_case:'After cleaning' };
  const summary = document.getElementById('profile-summary');
  summary.innerHTML = '';
  Object.keys(titles).forEach(function(k) {
    if (!profile[k]) return;
    const item = document.createElement('div');
    item.className = 'profile-item';
    item.innerHTML = '<div class="profile-item-label">' + titles[k] + '</div><div class="profile-item-val">' + (labelMap[k][profile[k]] || profile[k]) + '</div>';
    summary.appendChild(item);
  });
}

function goToDashboard() {
  window.location.href = 'DrData_Dashboard.html';
}

function skipOnboarding() {
  const user = JSON.parse(localStorage.getItem('dr_data_user') || '{}');
  user.is_new_user = false;
  localStorage.setItem('dr_data_user', JSON.stringify(user));
  window.location.href = 'DrData_Dashboard.html';
}

init();
</script>
